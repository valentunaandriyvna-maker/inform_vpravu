<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтерактивний тренажер: Еволюція обчислень (8 клас)</title>
    <!-- Підключення Tailwind CSS для сучасної та адаптивної стилізації -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Підключення шрифту Inter та JetBrains Mono для технічних індикаторів -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            overflow-x: hidden;
        }
        .font-mono-tech {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Плавні анімації переходів та інтерактивних елементів */
        .stage-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bead {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s;
            cursor: pointer;
        }
        .bead:hover {
            filter: brightness(1.1);
        }
        .finger-btn {
            transition: all 0.2s ease;
        }
        .pascal-wheel {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .led-glow {
            box-shadow: 0 0 12px #ef4444, 0 0 24px #ef4444;
        }
        .vacuum-tube-glow {
            box-shadow: 0 0 18px #f59e0b, inset 0 0 8px #fef08a;
        }
        /* Анімація появи повідомлень */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in {
            animation: slideIn 0.35s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">

    <!-- Верхня панель навігації та прогресу -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 sm:py-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xl shadow-md">
                        ⚙️
                    </div>
                    <div>
                        <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight">Еволюція обчислень</h1>
                        <p class="text-xs sm:text-sm text-slate-500 font-medium">Інтерактивний практикум • Інформатика, 8 клас</p>
                    </div>
                </div>

                <!-- Індикатор проходження етапів -->
                <div class="flex items-center gap-3 bg-slate-100 px-3.5 py-2 rounded-xl border border-slate-200">
                    <div class="text-xs font-semibold text-slate-600">Прогрес:</div>
                    <div class="w-28 sm:w-36 h-2.5 bg-slate-200 rounded-full overflow-hidden">
                        <div id="global-progress-bar" class="h-full bg-emerald-500 transition-all duration-500 rounded-full" style="width: 0%"></div>
                    </div>
                    <span id="global-progress-text" class="text-xs font-bold text-indigo-700 font-mono-tech">0 / 6</span>
                </div>
            </div>

            <!-- Стрічка вибору етапів (Таймлайн) -->
            <nav aria-label="Етапи еволюції" class="mt-3 pt-2 border-t border-slate-100 flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar" id="timeline-nav">
                <!-- Генерується через JS -->
            </nav>
        </div>
    </header>

    <!-- Головна робоча область тренажера -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6 sm:py-8">
        <div id="stage-container" class="animate-slide-in">
            <!-- Контент активного етапу рендериться тут -->
        </div>
    </main>

    <!-- Спливаюче повідомлення (замість alert) -->
    <div id="toast-box" class="fixed bottom-5 right-5 z-50 max-w-sm hidden">
        <div id="toast-content" class="bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-xl border border-slate-700 flex items-start gap-3 text-sm">
            <span id="toast-icon" class="text-lg">💡</span>
            <p id="toast-message" class="leading-snug"></p>
        </div>
    </div>

    <!-- Футер -->
    <footer class="bg-white border-t border-slate-200 py-4 px-4 text-center text-xs text-slate-500">
        Автономний освітній симулятор для уроків інформатики (8 клас) • Працює без інтернету та реєстрації
    </footer>

    <script>
        /**
         * АРХІТЕКТУРА ІНТЕРАКТИВНОГО ТРЕНАЖЕРА
         * Усі 7 історичних епох реалізовані як інтерактивні лабораторії,
         * де учень власноруч виконує обчислення або конструює пристрої.
         */

        // Стан додатку
        const state = {
            currentStage: 0,
            completedStages: new Set(),
            // Стан Етапу 1: Справжній двосекційний Абак (Соробан) на 4 розряди (Тисячі, Сотні, Десятки, Одиниці)
            // heaven: true = опущена до перекладини (+5), earth: 0..4 підняті до перекладини (+1 кожна)
            soroban: [
                { heaven: false, earth: 0 }, // Тисячі
                { heaven: false, earth: 1 }, // Сотні (початково виставлено перше число: 138)
                { heaven: false, earth: 3 }, // Десятки
                { heaven: true, earth: 3 }   // Одиниці (5 + 3 = 8)
            ],
            // Стан Етапу 2: Паскаліна (Сотні, Десятки, Одиниці)
            pascal: [0, 0, 0],
            // Стан Етапу 3: Арифмометр Лейбніца
            leibnizOperand: 14,
            leibnizCranks: 0,
            leibnizTotal: 0,
            // Стан Етапу 4: ENIAC (США, 1946) - комутація кабелів та лампи
            eniacWires: { power: false, accumulator: false, puncher: false },
            eniacInputA: 12,
            eniacInputB: 25,
            eniacResult: null,
            // Стан Етапу 5: МЕОМ (Україна, Київ, 1950) - перфокарта та феритова пам'ять
            mesmPunch: [0, 0, 0, 0, 0, 0], // 6 біт команди/даних
            mesmExecuted: false,
            // Стан Етапу 6: Перший ПК Altair 8800 (1975) - складання та програмування
            pcParts: {
                monitor: null, // 'none' (правильно), 'lcd', 'crt'
                keyboard: null, // 'switches' (правильно), 'qwerty'
                storage: null   // 'cassette' (правильно), 'flash'
            },
            altairSwitches: [0, 0, 0, 0, 0, 0, 0, 0], // 8-бітний регістр
            altairDeposited: false
        };

        // Опис етапів
        const stagesMeta = [
            { id: 0, short: "1. Абак", title: "Позиційна лічба: Стародавній Абак", year: "~2400 до н.е.", icon: "🧮" },
            { id: 1, short: "2. Машина Паскаля", title: "Паскаліна: Механічне додавання", year: "1642 р.", icon: "⚙️" },
            { id: 2, short: "3. Машина Лейбніца", title: "Арифмометр Лейбніца: Множення", year: "1673 р.", icon: "🔩" },
            { id: 3, short: "4. Перший ЕОМ США", title: "ENIAC: Електронні лампи та кабелі", year: "1946 р., США", icon: "💡" },
            { id: 4, short: "5. МЕОМ (Україна)", title: "МЕОМ С. Лебедєва: Перша в Європі", year: "1950 р., Київ", icon: "🇺🇦" },
            { id: 5, short: "6. Перший ПК", title: "Altair 8800: Яким був перший ПК?", year: "1975 р.", icon: "🎛️" }
        ];

        // Функція показу повідомлень замість alert()
        let toastTimeout;
        function showToast(message, icon = "💡") {
            const box = document.getElementById('toast-box');
            const msgEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');
            msgEl.textContent = message;
            iconEl.textContent = icon;
            box.classList.remove('hidden');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                box.classList.add('hidden');
            }, 4500);
        }

        // Позначення етапу як виконаного
        function completeStage(stageIndex) {
            if (!state.completedStages.has(stageIndex)) {
                state.completedStages.add(stageIndex);
                updateGlobalProgress();
                renderTimeline();
                showToast(`Чудово! Завдання етапу «${stagesMeta[stageIndex].short}» виконано!`, "🎉");
            }
        }

        // Оновлення глобальної шкали прогресу
        function updateGlobalProgress() {
            const count = state.completedStages.size;
            const total = stagesMeta.length;
            const percent = Math.round((count / total) * 100);
            document.getElementById('global-progress-bar').style.width = `${percent}%`;
            document.getElementById('global-progress-text').textContent = `${count} / ${total}`;
        }

        // Рендер навігаційної стрічки етапів
        function renderTimeline() {
            const nav = document.getElementById('timeline-nav');
            nav.innerHTML = stagesMeta.map((s, idx) => {
                const isActive = state.currentStage === idx;
                const isDone = state.completedStages.has(idx);
                let btnStyle = "bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200";
                if (isActive) {
                    btnStyle = "bg-indigo-600 text-white border-indigo-600 shadow-sm ring-2 ring-indigo-200";
                } else if (isDone) {
                    btnStyle = "bg-emerald-50 text-emerald-800 border-emerald-300 hover:bg-emerald-100";
                }
                return `
                    <button onclick="goToStage(${idx})"
                        class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-semibold whitespace-nowrap transition-all ${btnStyle}">
                        <span>${isDone && !isActive ? '✅' : s.icon}</span>
                        <span>${s.short}</span>
                    </button>
                `;
            }).join('');
        }

        function goToStage(idx) {
            state.currentStage = idx;
            renderTimeline();
            renderCurrentStage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Головний маршрутизатор рендерингу етапів
        function renderCurrentStage() {
            const container = document.getElementById('stage-container');
            container.classList.remove('animate-slide-in');
            void container.offsetWidth; // Перезапуск CSS анімації
            container.classList.add('animate-slide-in');

            switch (state.currentStage) {
                case 0: container.innerHTML = renderStage1_Abacus(); break;
                case 1: container.innerHTML = renderStage2_Pascal(); break;
                case 2: container.innerHTML = renderStage3_Leibniz(); break;
                case 3: container.innerHTML = renderStage4_ENIAC(); break;
                case 4: container.innerHTML = renderStage5_MESM(); break;
                case 5: container.innerHTML = renderStage6_FirstPC(); break;
            }
        }

        // Генератор нижніх кнопок навігації (Назад / Далі)
        function renderFooterNav() {
            const prevDisabled = state.currentStage === 0;
            const isLast = state.currentStage === stagesMeta.length - 1;
            const isDone = state.completedStages.has(state.currentStage);

            return `
                <div class="mt-8 pt-5 border-t border-slate-200 flex flex-wrap items-center justify-between gap-4">
                    <button onclick="goToStage(${state.currentStage - 1})" ${prevDisabled ? 'disabled' : ''}
                        class="px-5 py-2.5 rounded-xl font-semibold text-sm border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none transition">
                        ← Попередній етап
                    </button>

                    <div class="text-xs font-medium ${isDone ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-amber-700 bg-amber-50 border-amber-200'} px-3.5 py-2 rounded-xl border">
                        ${isDone ? '✅ Практичне завдання етапу виконано!' : '🎯 Виконайте інтерактивне завдання вище, щоб зарахувати етап'}
                    </div>

                    ${!isLast ? `
                        <button onclick="goToStage(${state.currentStage + 1})"
                            class="px-5 py-2.5 rounded-xl font-semibold text-sm bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm transition">
                            Наступний етап →
                        </button>
                    ` : `
                        <button onclick="showSummaryModal()"
                            class="px-5 py-2.5 rounded-xl font-semibold text-sm bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm transition">
                            🏆 Підсумок тренажера
                        </button>
                    `}
                </div>
            `;
        }

        // =========================================================================
        // ЕТАП 0: РУКА ЛЮДИНИ (Стародавня лічба по фалангах до 60)
        // =========================================================================
        function renderStage0_Fingers() {
            const dozensCount = state.dozens.filter(Boolean).length;
            const totalValue = dozensCount * 12 + state.phalanges;
            const targetValue = 43; // 3 дюжини (36) + 7 фаланг = 43

            if (totalValue === targetValue) {
                setTimeout(() => completeStage(0), 100);
            }

            const fingerCols = [
                { name: "Вказівний", start: 1 },
                { name: "Середній", start: 4 },
                { name: "Безіменний", start: 7 },
                { name: "Мізинець", start: 10 }
            ];
            const leftFingerNames = ["Великий", "Вказівний", "Середній", "Безіменний", "Мізинець"];

            return `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-8">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                        <span class="px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold uppercase tracking-wider">Етап 1 • ~3000 р. до н.е., Месопотамія</span>
                        <span class="text-xs font-semibold text-slate-500">Дванадцяткова та шістдесяткова системи</span>
                    </div>

                    <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-3">Секрет стародавніх рахівників: Лічба на фалангах до 60!</h2>
                    <p class="text-slate-600 text-sm sm:text-base leading-relaxed mb-6">
                        Звичайна людина на двох руках може порахувати лише до 10. Але стародавні шумери та купці Сходу винайшли геніальний спосіб рахувати на руках до <strong>60</strong>!
                        Великим пальцем правої руки вони по черзі торкалися <strong>12 фаланг</strong> (суглобів) чотирьох інших пальців (по 3 фаланги × 4 пальці = <strong>1 дюжина</strong>). Щойно доходили до 12 — загинався один палець на <strong>лівій руці</strong>. Саме звідси пішли <strong>12 місяців, 12 годин, 60 хвилин і 60 секунд</strong>!
                    </p>

                    <!-- Практичне завдання -->
                    <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-4 mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div class="flex items-start gap-3">
                            <span class="text-xl">🏺</span>
                            <div class="text-sm text-indigo-950">
                                <strong>Ігрове завдання купця:</strong> До порту прибуло <strong>43 амфори</strong> з олією. Зафіксуйте число <strong>43</strong> на руках: відмітьте повні дюжини на лівій руці та торкніться потрібної фаланги на правій!
                            </div>
                        </div>
                        <div class="bg-white px-4 py-2 rounded-xl border border-indigo-200 text-center shrink-0">
                            <div class="text-[11px] text-slate-500 font-semibold">Разом на руках:</div>
                            <div class="text-2xl font-mono-tech font-extrabold ${totalValue === targetValue ? 'text-emerald-600' : 'text-indigo-600'}">
                                ${totalValue} <span class="text-xs font-normal text-slate-400">/ ${targetValue}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Інтерактивний симулятор двох рук -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- ЛІВА РУКА: Дюжини (×12) -->
                        <div class="p-5 rounded-2xl border-2 border-amber-200 bg-amber-50/40 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <span class="font-extrabold text-slate-800 text-sm">✋ Ліва рука — Лічильник дюжин</span>
                                    <span class="text-xs font-mono-tech bg-amber-200/80 text-amber-950 px-2.5 py-0.5 rounded-lg font-bold">
                                        ${dozensCount} × 12 = ${dozensCount * 12}
                                    </span>
                                </div>
                                <p class="text-xs text-slate-600 mb-4">Кожен піднятий палець лівої руки додає <strong>+12</strong> (одну повну дюжину).</p>
                            </div>

                            <div class="flex items-end justify-center gap-2 sm:gap-3 h-44 bg-white/80 p-4 rounded-2xl border border-amber-200/70">
                                ${leftFingerNames.map((name, idx) => {
                                    const heights = ['h-20', 'h-32', 'h-36', 'h-32', 'h-24'];
                                    const isActive = state.dozens[idx];
                                    return `
                                        <button onclick="toggleDozenFinger(${idx})"
                                            class="finger-btn w-12 sm:w-14 ${isActive ? heights[idx] + ' bg-amber-500 border-amber-700 text-white shadow-md' : 'h-14 bg-slate-200 border-slate-300 text-slate-600 hover:bg-slate-300'} border-2 rounded-t-2xl rounded-b-lg flex flex-col items-center justify-between p-1.5">
                                            <span class="text-xs font-extrabold font-mono-tech">+12</span>
                                            <span class="text-[10px] font-medium leading-tight text-center">${name}</span>
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- ПРАВА РУКА: 12 Фаланґ (одиниці 1..12) -->
                        <div class="p-5 rounded-2xl border-2 border-indigo-200 bg-indigo-50/30 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <span class="font-extrabold text-slate-800 text-sm">🤚 Права рука — 12 фаланг</span>
                                    <span class="text-xs font-mono-tech bg-indigo-100 text-indigo-900 px-2.5 py-0.5 rounded-lg font-bold">
                                        Фаланга: +${state.phalanges}
                                    </span>
                                </div>
                                <p class="text-xs text-slate-600 mb-4">Натисніть на фалангу (від 1 до 12), до якої торкається великий палець:</p>
                            </div>

                            <div class="bg-white p-4 rounded-2xl border border-indigo-200/80">
                                <div class="grid grid-cols-4 gap-2.5">
                                    ${fingerCols.map(col => `
                                        <div class="flex flex-col gap-1.5">
                                            <div class="text-[11px] font-bold text-center text-slate-500 mb-0.5">${col.name}</div>
                                            ${[2, 1, 0].map(offset => {
                                                const num = col.start + offset;
                                                const isSelected = num <= state.phalanges;
                                                const isExact = num === state.phalanges;
                                                return `
                                                    <button onclick="setPhalanx(${num})"
                                                        class="h-10 rounded-xl border-2 font-mono-tech font-bold text-sm transition flex items-center justify-center relative
                                                        ${isExact ? 'bg-indigo-600 border-indigo-800 text-white shadow-md scale-105' :
                                                          isSelected ? 'bg-indigo-100 border-indigo-300 text-indigo-900' :
                                                          'bg-slate-100 border-slate-200 text-slate-600 hover:bg-amber-50 hover:border-amber-300'}">
                                                        ${num}
                                                        ${isExact ? '<span class="absolute -top-1.5 -right-1.5 text-xs">👍</span>' : ''}
                                                    </button>
                                                `;
                                            }).join('')}
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="mt-3 text-right">
                                    <button onclick="setPhalanx(0)" class="text-xs text-slate-500 hover:text-slate-800 underline">
                                        Скинути фаланги (0)
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    ${renderFooterNav()}
                </div>
            `;
        }

        function toggleDozenFinger(idx) {
            state.dozens[idx] = !state.dozens[idx];
            renderCurrentStage();
        }

        function setPhalanx(num) {
            state.phalanges = (state.phalanges === num) ? 0 : num;
            renderCurrentStage();
        }

        // =========================================================================
        // ЕТАП 1: СПРАВЖНІЙ АБАК (СОРОБАН / СУАНЬПАНЬ — Двосекційна модель)
        // =========================================================================
        function renderStage1_Abacus() {
            const weights = [1000, 100, 10, 1];
            const colNames = ["Тисячі", "Сотні", "Десятки", "Одиниці"];

            // Обчислення значення на соробані: верхня кісточка = 5, кожна піднята нижня = 1
            const digits = state.soroban.map(col => (col.heaven ? 5 : 0) + col.earth);
            const currentTotal = digits[0] * 1000 + digits[1] * 100 + digits[2] * 10 + digits[3];

            // Торгівельна задача: було 138 монет, покупець доплатив 245 монет -> разом 383!
            const targetTotal = 383;

            if (currentTotal === targetTotal) {
                setTimeout(() => completeStage(0), 100);
            }

            return `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-8">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-4">

                                <div class="p-3.5 rounded-2xl border ${done ? 'bg-emerald-50 border-emerald-200 text-emerald-950' : 'bg-slate-50 border-slate-200 text-slate-600'} flex items-center justify-between">
                                    <div class="flex items-center gap-2.5">
                                        <span class="text-lg">${s.icon}</span>
                                        <div>
                                            <div class="text-xs font-bold">${s.short}</div>
                                            <div class="text-[11px] opacity-75">${s.year}</div>
                                        </div>
                                    </div>
                                    <span class="text-xs font-bold">${done ? '✅ Виконано' : '⏳ Не завершено'}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="flex flex-wrap items-center justify-center gap-3">
                        <button onclick="goToStage(0)" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow">
                            🔄 Повернутися до етапів
                        </button>
                    </div>
                </div>
            `;
        }

        // Ініціалізація при завантаженні сторінки
        window.onload = function() {
            renderTimeline();
            renderCurrentStage();
            updateGlobalProgress();
        };
    </script>
</body>
</html>
